services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: skyatlas
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: skyatlas
    ports: ["5555:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    # 6380 belongs to another project's Redis on this machine, and the binding
    # silently did not take — the backend was pointed at a stranger's cache.
    ports: ["6381:6379"]
volumes:
  pgdata:
