services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: skyatlas
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: skyatlas
    ports: ["5555:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    ports: ["6380:6379"]
volumes:
  pgdata:
