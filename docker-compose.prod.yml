# Logs are rotated by size: each service keeps at most 5 × 10 MB, and older
# lines are deleted (the Privacy Policy describes this).
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    logging: *logging
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: skyatlas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: skyatlas
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skyatlas -d skyatlas"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    logging: *logging
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    logging: *logging
    build:
      # The repository root, not apps/backend: the image installs from the
      # workspace lockfile at the root and compiles against packages/shared.
      context: .
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    # The image's entrypoint applies pending Prisma migrations before starting
    # the server (set SKIP_MIGRATIONS=1 to opt out).
    env_file:
      # Must define AUTH_HMAC_SECRET (the server refuses to start without it in
      # production); see apps/backend/README.md for the full list.
      - ./apps/backend/.env.production
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://skyatlas:${POSTGRES_PASSWORD}@postgres:5432/skyatlas
      REDIS_URL: redis://redis:6379
      # Exactly one proxy in front: nginx. Client addresses come from the
      # X-Forwarded-For entry it writes.
      TRUST_PROXY: "1"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
      - public
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      # Migrations run before the server listens.
      start_period: 60s

  nginx:
    logging: *logging
    image: nginx:1.25-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
    depends_on:
      - backend
    networks:
      - public

  certbot:
    logging: *logging
    image: certbot/certbot:latest
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    # Run once to obtain cert:
    # docker compose -f docker-compose.prod.yml run --rm certbot certonly \
    #   --webroot --webroot-path /var/www/certbot \
    #   -d api.skyatlas.app --email admin@skyatlas.app --agree-tos
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done"

volumes:
  pgdata:
  redisdata:
  certbot_www:
  certbot_certs:

networks:
  internal:
    driver: bridge
  public:
    driver: bridge
