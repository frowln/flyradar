name: iOS
# The real iPhone app: Xcode builds it for the simulator, then the demo flight
# is flown on an iPhone simulator and kept as a video with screenshots.
#
# A macOS minute costs ten Linux minutes on a private repository, so a push
# builds only when its commit message starts with [ios]; it can also be run by
# hand from the Actions tab once this file is on the default branch.
on:
  push:
    paths:
      - 'apps/mobile/**'
      - 'packages/**'
      - 'package-lock.json'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

jobs:
  simulator:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, '[ios]')
    # On the job, not the workflow: a push without [ios] skips this job and
    # must not cancel a build already running.
    concurrency:
      group: ios-simulator-${{ github.ref }}
      cancel-in-progress: true
    runs-on: macos-15
    # Writes the screenshots back to the branch (see the last step).
    permissions:
      contents: write
    timeout-minutes: 80
    env:
      SENTRY_DISABLE_AUTO_UPLOAD: 'true'
      EXPO_NO_TELEMETRY: '1'
      # The client demo: sample travellers, demo flights in the passport, the Pro screen.
      EXPO_PUBLIC_DEMO_SOCIAL: '1'
      EXPO_PUBLIC_DEMO_COUNTS: '1'
      EXPO_PUBLIC_DEMO_PAYWALL: '1'
      # The error screen prints what broke: a screenshot is enough to fix it.
      EXPO_PUBLIC_SHOW_ERRORS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - run: npm ci
      - name: Xcode and simulators
        run: |
          xcodebuild -version
          xcrun simctl list runtimes
      # The native app only changes with the native code: when an earlier run
      # built the same dependencies and config, its app is reused and only the
      # JavaScript inside it is rebuilt (minutes instead of twenty).
      - name: Native fingerprint
        id: native
        run: echo "key=skyatlas-sim-app-v1-${{ hashFiles('package-lock.json', 'apps/mobile/package.json', 'apps/mobile/app.json', 'apps/mobile/app.config.js', 'apps/mobile/assets/*.png') }}" >> "$GITHUB_OUTPUT"
      - name: Built app from an earlier run
        id: cached
        uses: actions/cache/restore@v4
        with:
          path: ~/skyatlas-app
          key: ${{ steps.native.outputs.key }}
      - name: Native project (expo prebuild + CocoaPods)
        if: steps.cached.outputs.cache-hit != 'true'
        working-directory: apps/mobile
        run: npx expo prebuild --platform ios --clean
      - name: Build in Xcode for the simulator
        if: steps.cached.outputs.cache-hit != 'true'
        working-directory: apps/mobile/ios
        run: |
          set -o pipefail
          xcodebuild -workspace SkyAtlas.xcworkspace -scheme SkyAtlas -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO \
            build | tee "$RUNNER_TEMP/xcodebuild.log" | xcbeautify --quieter
          rm -rf ~/skyatlas-app && mkdir -p ~/skyatlas-app
          cp -R build/Build/Products/Release-iphonesimulator/SkyAtlas.app ~/skyatlas-app/
      - name: Keep the built app for the next run
        if: steps.cached.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/skyatlas-app
          key: ${{ steps.native.outputs.key }}
      - name: This commit's JavaScript in the reused app
        if: steps.cached.outputs.cache-hit == 'true'
        working-directory: apps/mobile
        run: |
          APP="$HOME/skyatlas-app/SkyAtlas.app"
          # Metro resolves from the workspace root: the entry must be absolute.
          npx expo export:embed --platform ios --dev false \
            --entry-file "$PWD/index.ts" --bundle-output "$RUNNER_TEMP/main.js" --assets-dest "$APP"
          # Hermes bytecode, as Xcode's own bundling step produces.
          ../../node_modules/react-native/sdks/hermesc/osx-bin/hermesc -emit-binary -O -out "$APP/main.jsbundle" "$RUNNER_TEMP/main.js"
          ls -la "$APP/main.jsbundle"
      - name: Build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: ${{ runner.temp }}/xcodebuild.log
      - name: Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Fly the demo on an iPhone simulator
        id: demo
        working-directory: apps/mobile
        run: scripts/simulator-demo.sh "$HOME/skyatlas-app/SkyAtlas.app" "$RUNNER_TEMP/demo"
      - name: A small copy of the video
        if: always() && steps.demo.outcome != 'skipped'
        env:
          DEMO: ${{ runner.temp }}/demo
        run: |
          [ -f "$DEMO/demo-flight.mp4" ] || exit 0
          brew install ffmpeg >/dev/null 2>&1 || true
          skip=0
          [ -f "$DEMO/.tour-start" ] && skip=$(( $(cat "$DEMO/.tour-start") - $(cat "$DEMO/.video-start") ))
          ffmpeg -loglevel error -y -ss "$skip" -i "$DEMO/demo-flight.mp4" -vf "scale=480:-2,fps=24" \
            -c:v libx264 -preset veryfast -crf 30 -pix_fmt yuv420p -movflags +faststart -an "$DEMO/demo-tour-480p.mp4" || true
          ls -la "$DEMO"
      - name: Keep the video and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-demo
          path: |
            ${{ runner.temp }}/demo
            ~/.maestro/tests
          if-no-files-found: warn
      # Artifacts live in blob storage that not every reviewer can reach; small
      # copies of the screenshots and the step results go into the branch
      # itself, under docs/ios-simulator/. Pushed with GITHUB_TOKEN, so the
      # commit starts no new workflow runs.
      - name: Screenshots into the branch
        if: always() && github.event_name == 'push' && steps.demo.outcome != 'skipped'
        env:
          DEMO: ${{ runner.temp }}/demo
          SHOTS: ${{ runner.temp }}/shots-small
        run: |
          mkdir -p "$SHOTS"
          for f in "$DEMO"/shots/*.png; do
            [ -f "$f" ] && sips -s format jpeg -s formatOptions 70 --resampleWidth 480 "$f" --out "$SHOTS/$(basename "$f" .png).jpg" >/dev/null
          done
          find ~/.maestro/tests -name '*.png' 2>/dev/null | while read -r f; do
            sips -s format jpeg -s formatOptions 60 --resampleWidth 480 "$f" --out "$SHOTS/maestro-$(basename "$f" .png | tr ' ' '-').jpg" >/dev/null
          done
          cp "$DEMO/summary.txt" "$SHOTS/" 2>/dev/null || true
          # Each step of each part, passed or failed and why.
          find "$DEMO/maestro-debug" "$DEMO/maestro" -name 'commands*.json' 2>/dev/null | while read -r f; do
            python3 -c 'import json,sys; [print(("OK  " if c.get("metadata",{}).get("status")=="COMPLETED" else c.get("metadata",{}).get("status","?")[:4].ljust(4)), json.dumps(c.get("command",{}),ensure_ascii=False)[:160], (c.get("metadata",{}).get("error") or {}).get("message","")[:200]) for c in json.load(open(sys.argv[1]))]' "$f" > "$SHOTS/steps-$(basename "$f" .json).txt" 2>/dev/null || true
          done
          # The tour on video, if the small copy came out small enough to keep in git.
          if [ -f "$DEMO/demo-tour-480p.mp4" ] && [ "$(stat -f%z "$DEMO/demo-tour-480p.mp4")" -lt 60000000 ]; then
            cp "$DEMO/demo-tour-480p.mp4" "$SHOTS/"
          fi
          # .log files are ignored by git here: the app's log goes in as text.
          if [ -f "$DEMO/app.log" ]; then
            grep -E "\[SkyAtlas\]|Error|Exception|ReactNativeJS|RCTLog|fatal" "$DEMO/app.log" | tail -400 > "$SHOTS/app-errors.txt" || true
            tail -200 "$DEMO/app.log" > "$SHOTS/app-log-tail.txt" || true
          fi
          for c in "$DEMO"/crash/*; do
            [ -f "$c" ] && python3 apps/mobile/scripts/crash-summary.py "$c" > "$SHOTS/crash-$(basename "$c" | tr ' ' '-').txt" || true
          done
          # The whole video at a glance: a frame every five seconds.
          if [ -f "$DEMO/demo-flight.mp4" ] && command -v ffmpeg >/dev/null; then
            ffmpeg -loglevel error -y -i "$DEMO/demo-flight.mp4" -vf "fps=1/5,scale=160:-2,tile=10x4" -q:v 4 "$SHOTS/video-sheet-%02d.jpg" || true
          fi
          [ -f "$DEMO/maestro.log" ] && tail -c 150000 "$DEMO/maestro.log" > "$SHOTS/maestro-log.txt"
          # What was on screen, as text: the UI tree Maestro saw after each phase.
          for t in "$DEMO"/tree/*.json; do
            [ -f "$t" ] && python3 apps/mobile/scripts/ui-tree-text.py "$t" > "$SHOTS/tree-$(basename "$t" .json).txt" || true
          done
          echo "${GITHUB_SHA::7} · $(date -u '+%Y-%m-%d %H:%M UTC') · $(xcodebuild -version 2>/dev/null | sed -n 1p)" > "$SHOTS/BUILD.txt"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch --depth=1 origin "$GITHUB_REF_NAME"
            git checkout -q -f -B ios-shots FETCH_HEAD
            rm -rf docs/ios-simulator && mkdir -p docs/ios-simulator && cp -R "$SHOTS"/. docs/ios-simulator/
            git add -A docs/ios-simulator
            git commit -q -m "iOS simulator screenshots for ${GITHUB_SHA::7}" || exit 0
            git push origin "HEAD:refs/heads/$GITHUB_REF_NAME" && exit 0
            sleep 5
          done
          exit 1
      - name: Keep the simulator app
        uses: actions/upload-artifact@v4
        with:
          name: SkyAtlas-simulator-app
          path: ~/skyatlas-app/SkyAtlas.app
