# This file is included inside the `http` block of nginx.conf, so directives
# that are only valid at http level (limit_req_zone, upstream) live up here,
# outside any `server`. limit_req_zone inside a server block is a config error
# and nginx refuses to start.
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;

# Request lines without the query string ($uri, not $request): a track request
# carries the flight number in it, and the Privacy Policy says logs do not.
log_format skyatlas '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                    '$status $body_bytes_sent "$http_user_agent" $request_time';
access_log /var/log/nginx/access.log skyatlas;
# 429 tells a client to back off; nginx's default 503 reads as an outage.
limit_req_status 429;

upstream backend {
    server backend:3000;
    keepalive 32;
}

# HTTP — redirect to HTTPS and serve ACME challenges
server {
    listen 80;
    server_name api.skyatlas.app;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl;
    http2 on;
    server_name api.skyatlas.app;

    ssl_certificate     /etc/letsencrypt/live/api.skyatlas.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.skyatlas.app/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Rate limiting. The burst absorbs a screen opening several requests at
    # once and the app polling a package job every few seconds.
    limit_req zone=api burst=20 nodelay;

    # Gzip
    gzip on;
    gzip_types application/json text/plain;

    client_max_body_size 1m;

    # Proxy settings, inherited by every location below that sets none of its own.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Overwritten, not appended: nginx is the edge, so any X-Forwarded-For the
    # client sent is fiction. The backend trusts exactly one hop (TRUST_PROXY)
    # and reads the client address from here for its rate limiter.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;

    # Prometheus scrapes the backend on the internal network; the public edge
    # has no business serving it. `^~` also covers /metrics/ and /metrics?…,
    # and matching happens after nginx decodes the URI, so %-encoding does not
    # get around it.
    location ^~ /metrics {
        return 404;
    }

    # Package builds run as background jobs now (POST answers 202 at once), but
    # app versions that still use `?sync=1` hold the request open for the whole
    # build — 45 seconds and more on a cold route.
    location = /flights/package {
        proxy_pass http://backend;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://backend;
    }
}
