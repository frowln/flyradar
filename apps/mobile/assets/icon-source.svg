<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.4">
      <stop offset="0%" stop-color="#1E2540"/>
      <stop offset="100%" stop-color="#0A0E1A"/>
    </radialGradient>
    <radialGradient id="globe" cx="0.35" cy="0.35">
      <stop offset="0%" stop-color="#3D8BFD"/>
      <stop offset="100%" stop-color="#1A3A6E"/>
    </radialGradient>
  </defs>
  <rect width="1024" height="1024" rx="220" fill="url(#bg)"/>
  <circle cx="512" cy="512" r="280" fill="url(#globe)" opacity="0.85"/>
  <!-- Latitude lines -->
  <ellipse cx="512" cy="512" rx="280" ry="80" stroke="#3D8BFD" stroke-width="2" fill="none" opacity="0.3"/>
  <ellipse cx="512" cy="512" rx="280" ry="160" stroke="#3D8BFD" stroke-width="2" fill="none" opacity="0.3"/>
  <ellipse cx="512" cy="512" rx="280" ry="240" stroke="#3D8BFD" stroke-width="2" fill="none" opacity="0.3"/>
  <!-- Meridian -->
  <line x1="512" y1="232" x2="512" y2="792" stroke="#3D8BFD" stroke-width="2" opacity="0.3"/>
  <!-- Flight path arc -->
  <path d="M 280 600 Q 512 350 744 600" stroke="#FFC857" stroke-width="6" fill="none" stroke-linecap="round" stroke-dasharray="0,0"/>
  <!-- Plane (simple silhouette) -->
  <g transform="translate(744 600) rotate(45)">
    <path d="M 0 -30 L 40 0 L 0 30 L -10 20 L -10 5 L -40 5 L -40 -5 L -10 -5 L -10 -20 Z" fill="#FFC857"/>
  </g>
  <!-- Origin dot -->
  <circle cx="280" cy="600" r="14" fill="#FFC857"/>
  <circle cx="280" cy="600" r="22" fill="none" stroke="#FFC857" stroke-width="2" opacity="0.5"/>
</svg>
