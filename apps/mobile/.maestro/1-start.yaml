# Onboarding → board → demo flight Moscow–Sochi, in Russian.
# Run by .github/workflows/ios.yml; locally: maestro test .maestro/1-start.yaml
appId: com.skyatlas.app
---
- launchApp:
    clearState: true
    permissions:
      all: allow
- extendedWaitUntil:
    visible: "Что за окном"
    timeout: 90000
- takeScreenshot: 01-onboarding
- tapOn: "дальше"
- tapOn: "дальше"
- takeScreenshot: 02-onboarding-last
- tapOn: "Или выбрать маршрут демо"
- extendedWaitUntil:
    visible: "Узнайте, над чем летите"
    timeout: 20000
- takeScreenshot: 03-board
- scrollUntilVisible:
    element: "Москва — Сочи.*"
    direction: DOWN
- takeScreenshot: 04-board-routes
- tapOn: "Москва — Сочи.*"
- tapOn:
    text: "Разрешить"
    optional: true
- tapOn:
    text: "Allow"
    optional: true
- extendedWaitUntil:
    visible: "во весь экран"
    timeout: 90000
- takeScreenshot: 05-flight
