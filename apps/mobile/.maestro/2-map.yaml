# The flight map: full screen, drag away, back to the aircraft, night chart.
appId: com.skyatlas.app
---
- tapOn: "во весь экран"
- waitForAnimationToEnd
- takeScreenshot: 10-map-full
- swipe:
    start: 50%, 50%
    end: 15%, 25%
    duration: 700
- waitForAnimationToEnd
- takeScreenshot: 11-map-dragged
- tapOn: "Вернуть карту к самолёту и следить за ним"
- waitForAnimationToEnd
- takeScreenshot: 12-map-follow
- tapOn:
    text: "Показать тёмную ночную карту"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: 13-map-night
- tapOn:
    text: "Показать цветную карту с рельефом"
    optional: true
- tapOn: "свернуть"
- waitForAnimationToEnd
- takeScreenshot: 14-flight
